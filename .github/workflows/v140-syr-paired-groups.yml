name: Screen combined Syracuse inbound-outbound bank wave proposals
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-paired-groups.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v140-syr-paired-groups
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/screen_schedule_7_v1_4_0_syr_paired_groups.py
      - name: Archive grouped candidate only (no accepted draft changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_paired_banks_native.json
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_paired_*_canonical.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive combined Syracuse inbound/outbound feasibility [skip ci]"
            git pull --rebase origin schedule-7-v1.4.0-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
