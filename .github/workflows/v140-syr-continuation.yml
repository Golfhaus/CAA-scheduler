name: Validate v1.4 Syracuse bank-linked route continuation
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-continuation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Evaluate R107 and R160 mini-bank turns with additional flying
        run: python scripts/screen_schedule_7_v1_4_0_syr_continuations.py
      - name: Archive read-only continuation feasibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_bank_continuations.json
          if ! git diff --cached --quiet; then
            git commit -m "Record v1.4 Syracuse bank-linked route continuation feasibility [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
