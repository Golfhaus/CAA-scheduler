name: Native validate combined v1.4.1 CRJ200 growth
on:
  push:
    branches: [schedule-7-v1.4.1-utilization-analysis]
    paths:
      - '.github/workflows/v141-combined.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/screen_schedule_7_v1_4_1_utilization.py
      - run: python scripts/screen_schedule_7_v1_4_1_supplemental.py
      - run: python scripts/screen_schedule_7_v1_4_1_combined.py
      - name: Archive no-publish combined feasibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_1_utilization/combined_screen.json
          if ! git diff --cached --quiet; then
            git commit -m "Record multi-route v1.4.1 feasibility [skip ci]"
            git restore --worktree .
            git pull --rebase origin schedule-7-v1.4.1-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.1-utilization-analysis
          fi
