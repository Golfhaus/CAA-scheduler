name: v1.4.3 seven-route rebuild hard passenger coverage gate
# Research workflow: run manually; no push or pull_request triggers.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_seven_route_rebuild_candidate.py
      - run: node scripts/v143_rebuild_guard.mjs data/schedules/schedule_7_v1_4_3_rebuild_candidate/canonical_schedule.json
      - run: node scripts/v143_seven_route_rebuild_audit.mjs
