name: Build candidate schedule

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Repository path to an approved build_config.json
        required: true
        type: string
      output_name:
        description: Artifact name
        required: false
        default: caa-candidate
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Compile candidate
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
        run: >-
          python -m caa_scheduler build-candidate
          "$CONFIG_PATH"
          --output builds/action-candidate
      - name: Upload candidate package
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: "${{ inputs.output_name }}"
          path: builds/action-candidate
          if-no-files-found: error
          retention-days: 30
