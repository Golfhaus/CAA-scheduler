name: Regenerate 1266-flight v1.4.1 R108 PIT provisional draft
on:
  push:
    branches: [schedule-7-v1.4.1-utilization-analysis]
    paths:
      - '.github/workflows/v141-r108-provisional-draft.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v141-r108-provisional-draft
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Rebuild provisional schedule and validate R108 integration
        run: python scripts/build_schedule_7_v1_4_1_draft.py
      - name: Archive validated provisional draft without publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/schedules/schedule_7_v1_4_1_draft/
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate 1266-flight v1.4.1 provisional draft with R108 PIT [skip ci]"
            git restore --worktree .
            git clean -fd outputs/schedule_7_v1_4_1_utilization/
            git pull --rebase origin schedule-7-v1.4.1-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.1-utilization-analysis
          fi
