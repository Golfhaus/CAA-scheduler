name: Rank Syracuse paired-wave weighted passenger impacts (fixed)
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-pair-ranking.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/build_schedule_7_v1_4_0_syr_paired_individual.py
      - run: node scripts/audit_schedule_7_v1_4_0_syr_individual_pairs.mjs
      - name: Archive standalone passenger audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_single_paired_network.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 18 individual Syracuse bank-pair connection reviews [skip ci]"
            git pull --rebase origin schedule-7-v1.4.0-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
