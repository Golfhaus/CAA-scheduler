name: v1.4.3 AH line flight reassignment
# Research workflow: run manually; no push or pull_request triggers.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_ah_pair_exchange_screen.py
