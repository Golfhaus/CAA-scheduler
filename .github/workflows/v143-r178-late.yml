name: v1.4.3 R178 late turnaround options
# Research workflow: manually triggered only.
on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_r178_late_turns.py
      - run: node scripts/v143_r178_late_passenger_screen.mjs
