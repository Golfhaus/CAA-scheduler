name: Persist unpublished v1.4.3 experimental reconstructions
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  save:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/schedule-7-v1.4.3-utilization
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_seven_route_rebuild_candidate.py
      - run: node scripts/v143_rebuild_guard.mjs data/schedules/schedule_7_v1_4_3_rebuild_candidate/canonical_schedule.json
      - run: python scripts/v143_cumulative_ah_exchange.py
      - run: node scripts/v143_rebuild_guard.mjs data/schedules/schedule_7_v1_4_3_ah_exchange_candidate/canonical_schedule.json
      - name: Commit development-only candidate snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedules/schedule_7_v1_4_3_rebuild_candidate/ data/schedules/schedule_7_v1_4_3_ah_exchange_candidate/
          if ! git diff --cached --quiet; then
            git commit -m "Save native-validated v1.4.3 experimental route reconstructions [skip ci]"
            git push origin HEAD:analysis/schedule-7-v1.4.3-utilization
          fi
