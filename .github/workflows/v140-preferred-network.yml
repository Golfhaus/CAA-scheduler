name: Validate preferred R160 R107 A-B-C candidate and network
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-preferred-network.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v140-preferred-network
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Combined native feasibility for R160 and R107
        run: python scripts/screen_schedule_7_v1_4_0_preferred_combined.py
      - name: Compare reasonable passenger itineraries against accepted draft
        run: |
          test -f outputs/schedule_7_v1_4_0_utilization/preferred_combined_canonical.json
          node scripts/audit_schedule_7_v1_4_0_preferred_network.mjs
      - name: Archive read-only evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/preferred_combined_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive unaccepted v1.4 combined P2P feasibility and network audit [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
