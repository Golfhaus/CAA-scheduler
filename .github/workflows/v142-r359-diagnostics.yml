name: v1.4.2 BNA/BHM Gate Diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/build_schedule_7_v1_4_2_r177_candidate.py
      - run: python scripts/v142_r359_diagnostics.py
