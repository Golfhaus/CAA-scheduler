name: Validate focused BHM v1.3.3 mini-banks
on:
  push:
    branches: [schedule-7-v1.3.3-bhm-mini-banks]
    paths:
      - '.github/workflows/v133-bhm-focused.yml'
      - 'scripts/screen_schedule_7_v1_3_3_bhm_mx5_rotations.py'
      - 'scripts/audit_schedule_7_v1_3_3_bhm_network.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Validate four BHM aircraft through native operating and gate checks
        run: python scripts/screen_schedule_7_v1_3_3_bhm_mx5_rotations.py
      - name: Compare full passenger network and north-south connections
        run: node scripts/audit_schedule_7_v1_3_3_bhm_network.mjs
      - name: Preserve results without publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_3_3_bhm_minibanks_mx5/
          if ! git diff --cached --quiet; then
            git commit -m "Archive BHM focused four-aircraft validation evidence [skip ci]"
            git restore --worktree .
            git pull --rebase origin schedule-7-v1.3.3-bhm-mini-banks
            git push
          fi
