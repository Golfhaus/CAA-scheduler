name: v1.4.3 coordinated R345 high-demand loop
on:
  pull_request:
    branches: [main]
jobs:
  feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_r345_bwi_coordinated.py
