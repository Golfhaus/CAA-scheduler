name: Latest Schedule Regression

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run latest schedule regression
        run: bash scripts/run_latest_regression.sh
      - name: Build web console
        run: python -m caa_scheduler build-web --output dist
