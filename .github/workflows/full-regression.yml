name: Full Schedule Regression

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.0.0"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FULL_SCHEDULE_REGRESSION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run current and historical schedule regression
        run: python -m unittest discover -s tests -v
      - name: Build web console
        run: python -m caa_scheduler build-web --output dist
      - name: Test web console helpers
        run: node --test tests/*.mjs
