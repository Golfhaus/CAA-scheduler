name: v1.4.3 R303 early MCI reconstruction
on:
  pull_request:
    branches: [main]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_r303_early_originator.py
