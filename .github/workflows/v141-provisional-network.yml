name: Audit 1.4.1 including R356 BDL connection protection
on:
  push:
    branches: [schedule-7-v1.4.1-utilization-analysis]
    paths:
      - '.github/workflows/v141-provisional-network.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit_schedule_7_v1_4_1_provisional.mjs
      - name: Archive cumulative v1.4.1 passenger audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_1_utilization/provisional_network.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit cumulative 1.4.1 R105/R162/R107 network [skip ci]"
            git restore --worktree .
            git clean -fd outputs/schedule_7_v1_4_1_utilization/
            git pull --rebase origin schedule-7-v1.4.1-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.1-utilization-analysis
          fi
