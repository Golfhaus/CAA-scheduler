name: Audit R160 productive SYR mini-bank continuation
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-r160-network.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/build_schedule_7_v1_4_0_syr_r160_network.py
      - run: node scripts/audit_schedule_7_v1_4_0_syr_r160_network.mjs
      - name: Archive read-only passenger-network comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_r160_extended_network_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Record R160 mini-bank extension connectivity audit [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
