name: Schedule 7 v1.4.2 tactical feasibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [analysis/schedule-7-v1.4.2-connection-gaps]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v142_hold_fitter.py
      - run: python scripts/v142_tactical_screen.py
      - run: python scripts/build_schedule_7_v1_4_2_draft.py
      - run: node scripts/audit_v142_tactical_network.mjs
      - run: node scripts/v142_connection_screen.mjs
      - run: node scripts/v142_three_aircraft_concept.mjs
