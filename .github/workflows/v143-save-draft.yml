name: Save verified v1.4.3 working draft
# Research workflow: run manually; no push or pull_request triggers.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: analysis/schedule-7-v1.4.3-utilization
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/build_schedule_7_v1_4_3_candidate.py
      - run: node scripts/v143_cumulative_passenger_audit.mjs
      - run: node scripts/v143_utilization_delta.mjs
      - name: Save candidate but not publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedules/schedule_7_v1_4_3_draft/
          if ! git diff --cached --quiet; then
            git commit -m "Save validated unpublished v1.4.3 utilization draft [skip ci]"
            git push origin HEAD:analysis/schedule-7-v1.4.3-utilization
          fi
