name: Package and verify Schedule 7 v1.3.3 release
# Completed release: run only when deliberately reproducing its package.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v133-publish-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Rebuild complete four-route-integrated v1.3.3 draft
        run: python scripts/build_schedule_7_v1_3_3_draft.py
      - name: Prepare full release package and web default
        run: python scripts/prepare_schedule_7_v1_3_3_release.py
      - name: Run latest regression suite against release
        run: bash scripts/run_latest_regression.sh
      - name: Verify web build and default schedule
        run: |
          python -m caa_scheduler build-web --output dist
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('dist/schedules.json').read_text())
          assert manifest['defaultScheduleId']=='schedule_7_v1_3_3'
          released=json.loads(Path('dist/data/schedules/schedule_7_v1_3_3/canonical_schedule.json').read_text())
          assert released['schedule']['status']=='released'
          assert len(released['legs'])==1253
          assert len({x['line'] for x in released['legs']})==17
          PY
      - name: Commit validated release assets to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f config/optimizations/schedule_7_v1_3_3_release.json data/schedules/schedule_7_v1_3_3/ data/schedules/schedule_7_v1_3_3_draft/ web/schedules.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Package validated v1.3.3 and set web default [skip ci]"
            git push origin HEAD:schedule-7-v1.3.3-bhm-mini-banks
          fi
