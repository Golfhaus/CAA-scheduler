name: Prepare and verify Schedule 7 v1.3.2 release
on:
  push:
    branches: [schedule-7-v1.3.2-maintenance-draft]
    paths:
      - '.github/workflows/v132-publish-package.yml'
      - 'scripts/prepare_schedule_7_v1_3_2_release.py'
      - 'docs/schedule_7_v1_3_2_release.md'
      - 'src/caa_scheduler/optimization_release.py'
      - 'tests/test_latest_schedule_release.py'
      - 'tests/test_latest_service_gains.py'
      - 'tests/test_operating_validation.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v132-publish-package
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Reproduce accepted 1,229-flight cumulative draft
        run: python scripts/build_schedule_7_v1_3_2_draft.py
      - name: Build guarded v1.3.2 release and update application manifest
        run: python scripts/prepare_schedule_7_v1_3_2_release.py
      - name: Full latest-release and schedule regression
        run: bash scripts/run_latest_regression.sh
      - name: Verify web build includes v1.3.2 default
        run: |
          python -m caa_scheduler build-web --output dist
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('dist/schedules.json').read_text())
          assert manifest['defaultScheduleId']=='schedule_7_v1_3_2'
          assert json.loads(Path('dist/data/schedules/schedule_7_v1_3_2/canonical_schedule.json').read_text())['schedule']['status']=='released'
          PY
      - name: Commit tested release assets to draft branch (never main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f config/optimizations/schedule_7_v1_3_2_release.json data/schedules/schedule_7_v1_3_2/ web/schedules.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "Package validated Schedule 7 v1.3.2 and set web default [skip ci]"
            git restore --worktree .
            git pull --rebase origin schedule-7-v1.3.2-maintenance-draft
            git push
          fi
