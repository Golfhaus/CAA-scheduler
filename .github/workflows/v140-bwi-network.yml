name: Audit R107 BWI-BDL loop and combined R160 network
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-bwi-network.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/screen_schedule_7_v1_4_0_combined_bwi.py
      - run: |
          test -f outputs/schedule_7_v1_4_0_utilization/r160_r107_bwi_combined_canonical.json
          node scripts/audit_schedule_7_v1_4_0_bwi_loop_network.mjs
      - name: Archive read-only BWI-BDL validation and network comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/r160_r107_bwi_combined_native.json outputs/schedule_7_v1_4_0_utilization/bwi_bdl_network_comparisons.json
          if ! git diff --cached --quiet; then
            git commit -m "Record v1.4 commercial and physical BWI-BDL A-B loop audit [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
