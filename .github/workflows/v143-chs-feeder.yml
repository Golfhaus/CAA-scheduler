name: Schedule 7 v1.4.3 CHS feeder feasibility
on:
  pull_request:
    branches: [main]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_chs_expansion_test.py
      - run: node scripts/v143_cumulative_passenger_audit.mjs
