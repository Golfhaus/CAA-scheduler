name: v1.4.3 AH reassignment single-run diagnostic
on:
  push:
    branches: [analysis/schedule-7-v1.4.3-utilization]
    paths:
      - scripts/v143_ah_pair_exchange_screen.py
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_ah_pair_exchange_screen.py
