name: Audit paired Syracuse arrival/departure networks
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-paired-network.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit_schedule_7_v1_4_0_syr_paired_network.mjs
      - name: Archive directional paired-wave passenger itinerary audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_paired_bank_network.json
          if ! git diff --cached --quiet; then
            git commit -m "Record paired Syracuse mini-bank passenger-network audit [skip ci]"
            git pull --rebase origin schedule-7-v1.4.0-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
