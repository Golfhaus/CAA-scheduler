name: Screen R108 SYR morning-bank productive rebuilds
on:
  push:
    branches: [schedule-7-v1.4.1-utilization-analysis]
    paths:
      - '.github/workflows/v141-r108-morning.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/screen_schedule_7_v1_4_1_r108_bank_rebuild.py
      - run: node scripts/audit_schedule_7_v1_4_1_r108_bank_rebuild.mjs
      - name: Archive experimental evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_1_utilization/r108_bank_rebuild_screen.json outputs/schedule_7_v1_4_1_utilization/r108_bank_rebuild_network.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive R108 morning-bank P2P feasibility and connection audit [skip ci]"
            git restore --worktree .
            git clean -fd outputs/schedule_7_v1_4_1_utilization/
            git pull --rebase origin schedule-7-v1.4.1-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.1-utilization-analysis
          fi
