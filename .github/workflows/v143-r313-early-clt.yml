name: v1.4.3 R313 early CLT turn screen
on:
  pull_request:
    branches: [main]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_r313_early_clt_turn.py
