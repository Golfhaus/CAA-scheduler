name: Materialize complete unpublished v1.3.2 draft
on:
  push:
    branches: [schedule-7-v1.3.2-maintenance-draft]
    paths:
      - '.github/workflows/v132-cumulative-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v132-cumulative-build
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run all published and draft regressions
        run: bash scripts/run_latest_regression.sh
      - name: Rebuild complete cumulative draft for tracked artifacts
        run: python scripts/build_schedule_7_v1_3_2_draft.py
      - name: Verify pinned 1229-flight selected checkpoint
        run: python tests/test_v1_3_2_cumulative_selected.py
      - name: Preserve complete, unpublished draft canonical and exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/schedules/schedule_7_v1_3_2_draft/canonical_schedule.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/validation_report.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/operating_validation_report.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/overnight_turn_validation.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/planning_snapshot.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/planning_validation_report.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/gates.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/timetable.json
          git add -f data/schedules/schedule_7_v1_3_2_draft/draft_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Materialize validated 1229-flight unpublished v1.3.2 canonical [skip ci]"
            git restore --worktree .
            git pull --rebase origin schedule-7-v1.3.2-maintenance-draft
            git push
          fi
