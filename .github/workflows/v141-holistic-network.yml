name: Audit demand-supported R167 morning BWI turn
on:
  push:
    branches: [schedule-7-v1.4.1-utilization-analysis]
    paths:
      - '.github/workflows/v141-holistic-network.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/audit_schedule_7_v1_4_1_holistic_network.mjs
      - name: Archive passenger-network feasibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_1_utilization/holistic_network.json
          if ! git diff --cached --quiet; then
            git commit -m "Record R167 ALB-BWI-ALB commercial audit [skip ci]"
            git restore --worktree .
            git clean -fd outputs/schedule_7_v1_4_1_utilization/
            git pull --rebase origin schedule-7-v1.4.1-utilization-analysis
            git push origin HEAD:schedule-7-v1.4.1-utilization-analysis
          fi
