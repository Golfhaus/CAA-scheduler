name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run routine tests against the latest schedule
        run: |
          python tests/test_v116_bhm_morning.py
          python tests/test_v120_crj900_lines.py
          python tests/test_latest_schedule_release.py
          python tests/test_operating_validation.py
          python tests/test_web_build.py
      - name: Build web console
        run: python -m caa_scheduler build-web --output dist
      - name: Test web console helpers
        run: node --test tests/*.mjs
