name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Rebuild golden baseline
        run: python -m caa_scheduler baseline --config config/baselines/schedule_6_v2_2_5.json
      - name: Confirm generated baseline is committed
        run: git diff --exit-code -- data/schedules/schedule_6_v2_2_5
