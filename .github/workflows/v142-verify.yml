name: Verify Schedule 7 v1.4.2 complete candidate
# Historical Schedule 7 v1.4.2 workflow: manually triggered only.
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/build_schedule_7_v1_4_2_r177_candidate.py
      - run: python scripts/v142_release_candidate.py
      - run: python -m caa_scheduler build-web --output dist
