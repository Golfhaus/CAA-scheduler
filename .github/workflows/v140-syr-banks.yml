name: Screen SYR 2h holds and candidate mini-banks for v1.4
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-banks.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v140-syr-banks
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run all 22 theoretical early-return candidates through native schedule validation
        run: python scripts/screen_schedule_7_v1_4_0_syr_banks.py
      - name: Archive analysis output (never accepted schedule)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_hold_inventory.json outputs/schedule_7_v1_4_0_utilization/syr_single_return_feasibility.json
          if ! git diff --cached --quiet; then
            git commit -m "Record read-only Syracuse gap-bank feasibility on v1.4 draft [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
