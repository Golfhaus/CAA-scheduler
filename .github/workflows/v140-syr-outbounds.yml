name: Test earlier onward SYR departures from mini-banks
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-syr-outbounds.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v140-syr-outbounds
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/screen_schedule_7_v1_4_0_syr_outbounds.py
      - name: Archive feasibility-only output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/syr_outbound_continuations.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive SYR onward mini-bank route continuation feasibility [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
