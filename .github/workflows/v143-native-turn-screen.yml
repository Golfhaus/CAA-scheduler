name: Schedule 7 v1.4.3 native turn feasibility
on:
  pull_request:
    branches: [main]
  push:
    branches: [analysis/schedule-7-v1.4.3-utilization]
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python scripts/v143_native_turn_screen.py
