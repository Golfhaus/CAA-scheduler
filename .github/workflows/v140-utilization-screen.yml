name: Screen Schedule 7 v1.4.0 CRJ200 hold recovery
on:
  push:
    branches: [schedule-7-v1.4.0-utilization-analysis]
    paths:
      - '.github/workflows/v140-utilization-screen.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v140-utilization-screen
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Test v1.4.0 hold recovery candidates against native validators
        run: python scripts/screen_schedule_7_v1_4_0_utilization.py
      - name: Test extensions from the late terminators
        run: python scripts/screen_schedule_7_v1_4_0_terminal_extensions.py
      - name: Screen late bank alignment alternatives
        run: python scripts/screen_schedule_7_v1_4_0_late_banks.py
      - name: Archive read-only feasibility evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_4_0_utilization/initial_feasibility.json outputs/schedule_7_v1_4_0_utilization/terminal_extensions.json outputs/schedule_7_v1_4_0_utilization/late_bank_alignment.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive CRJ200 initial hold-recovery feasibility screen [skip ci]"
            git push origin HEAD:schedule-7-v1.4.0-utilization-analysis
          fi
