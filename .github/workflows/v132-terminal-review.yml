name: Screen v1.3.2 R160 and R107 terminal alternatives
on:
  push:
    branches: [schedule-7-v1.3.2-maintenance-draft]
    paths:
      - '.github/workflows/v132-terminal-review.yml'
      - 'scripts/screen_schedule_7_v1_3_2_terminal_rebuild.py'
      - 'scripts/audit_schedule_7_v1_3_2_terminal_rebuild.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v132-terminal-review
  cancel-in-progress: true
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Physical operating screening
        run: python scripts/screen_schedule_7_v1_3_2_terminal_rebuild.py
      - name: Geographically reasonable network comparison
        run: node scripts/audit_schedule_7_v1_3_2_terminal_rebuild.mjs
      - name: Save screening results (not adopted or released)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/schedule_7_v1_3_2_terminal_rebuild/
          if ! git diff --cached --quiet; then
            git commit -m "Preserve R160 and R107 v1.3.2 feasibility screens [skip ci]"
            git restore --worktree .
            git pull --rebase origin schedule-7-v1.3.2-maintenance-draft
            git push
          fi
