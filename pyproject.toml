[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caa-scheduler"
version = "0.7.7"
description = "Deterministic schedule tooling for Coastal American Airways"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "openpyxl>=3.1,<4",
  "scipy==1.17.0",
]

[project.scripts]
caa-scheduler = "caa_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
